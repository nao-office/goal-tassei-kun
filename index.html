  function renderEvening(){const e=entry();const hasPlan=isPlanned(e);return header('今日の一歩を、成長に変える。','できた／できなかった、だけで終わらせない振り返り。')+

  function renderHistory(){let dates=Object.keys(data.entries).filter(d=>hasMorning(data.entries[d])||data.entries[d].reviewed||data.entries[d].minimumDone||txt(data.entries[d].growth)||txt(data.entries[d].achievement)||data.entries[d].lessonReviewed||txt(data.entries[d].lessonReflection)||txt(data.entries[d].lessonNextStep)).sort().reverse();let notes=dates.filter(d=>txt(data.entries[d].growth));let total=dates.length;let done=dates.filter(d=>data.entries[d].minimumDone).length;let learned=Object.values(data.entries).filter(e=>e.lessonReviewed).length;
    return header('成長の記録','連続日数よりも、「前の自分との差分」を大切に。')+`<div class="stack"><section class="panel"><div class="panelh"><h3>これまでの積み重ね</h3></div><div class="metrics"><div class="metric"><div class="metric-value">${total}</div><div class="metric-label">記録した日</div></div><div class="metric"><div class="metric-value">${done}</div><div class="metric-label">小さな一歩を達成</div></div><div class="metric"><div class="metric-value">${notes.length}</div><div class="metric-label">成長の差分を発見</div></div></div></section>

  function renderGoal(){
    const source=Array.isArray(data.goals)?data.goals:[],history=Array.isArray(data.goalHistory)?data.goalHistory:[],checks=Array.isArray(data.goalChecks)?data.goalChecks:[];
    const active=source.filter(g=>g.status!=='終了'),themes=[...new Set(source.map(g=>g.theme).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ja'));
    const visible=active.filter(g=>(goalPeriodFilter==='all'||g.period===goalPeriodFilter)&&(goalThemeFilter==='all'||g.theme===goalThemeFilter));
    const link=/^[A-Za-z0-9_-]{20,}$/.test(syncConfig.sheetId)?'https://docs.google.com/spreadsheets/d/'+encodeURIComponent(syncConfig.sheetId)+'/edit':'';
    let out=header('ゴール設定｜未来の自分を定義する','期間 × テーマ × 定性・定量で整理。変更がなければそのまま、気づいたときに更新。');
    out+='<div class="stack">'+renderGoalIdeas()+'<section class="form-panel"><div class="panelh"><h3>現在のゴール</h3><span class="chip">Google Sheetsと連携</span></div>';
    out+='<div class="goal-top-stats"><div class="goal-stat"><strong>'+active.length+'</strong><span>登録中のゴール</span></div><div class="goal-stat"><strong>'+new Set(active.map(g=>g.theme)).size+'</strong><span>テーマ数</span></div><div class="goal-stat"><strong>'+history.length+'</strong><span>履歴の件数</span></div></div>';
    out+='<p class="muted-text">1つのゴールには定性・定量の片方だけでも、両方でも設定できます。新規登録や更新はChatGPTとの会話かGoogle Sheetsから行い、ここでは閲覧します。直接シートを編集した場合、変更履歴は自動作成されないので注意してください。</p>';
    if(link)out+='<div class="foot-actions"><a href="'+esc(link)+'" target="_blank" rel="noopener noreferrer" class="button secondary">ゴール一覧をGoogle Sheetsで開く ↗</a>'+button('最新情報を同期 ↻','go-sync','outline')+'</div>';
    else out+='<div class="foot-actions">'+button('Google連携を設定 ↻','go-sync','secondary')+'</div>';
    out+='<div class="goal-filter-bar"><span class="smallmuted">期間</span>';
    for(const period of ['all',...GOAL_PERIODS])out+='<button type="button" data-goal-filter="'+esc(period)+'" class="'+(goalPeriodFilter===period?'active':'')+'">'+(period==='all'?'すべて':esc(period))+'</button>';
    out+='<label class="smallmuted" for="goalThemeFilter">テーマ</label><select id="goalThemeFilter" data-goal-theme-filter><option value="all">すべてのテーマ</option>'+themes.map(t=>'<option value="'+esc(t)+'"'+(t===goalThemeFilter?' selected':'')+'>'+esc(t)+'</option>').join('')+'</select></div>';
    if(!active.length)out+='<div class="info">まだ「ゴール一覧」に登録されたゴールがありません。ChatGPTで期間とテーマを決めて最初のゴールを登録してから、Google連携で同期してください。過去の会話にある数値は、期間が明確になるまで勝手に設定しません。</div>';
    else if(!visible.length)out+='<p class="empty">この期間・テーマに該当するゴールはありません。</p>';
    for(const period of GOAL_PERIODS){
      const list=visible.filter(g=>g.period===period);
      if(!list.length)continue;
      out+='<div class="goal-period"><h3>🗓 '+esc(period)+' <small>'+list.length+'件</small></h3><div class="goal-card-grid">';
      for(const g of list){
        out+='<article class="goal-card"><div class="goal-card-top"><span class="title">'+esc(g.theme||'テーマ未設定')+'</span><span class="'+(g.status==='達成'?'chip':'chip gray')+'">'+esc(g.status||'進行中')+'</span></div>';
        out+='<h4>🌱 定性ゴール</h4><p class="'+(!g.qualitative?'subtle':'')+'">'+esc(g.qualitative||'未設定')+'</p>';
        out+='<h4>📊 定量ゴール</h4><p class="'+(!g.quantitative?'subtle':'')+'">'+esc(g.quantitative?(g.quantitative+(g.unit?' '+g.unit:'')):'未設定')+'</p>';
        if(g.scene)out+='<h4>🌅 未来の景色</h4><p>'+esc(g.scene)+'</p>';
        if(g.be)out+='<h4>✨ 在り方（BE）</h4><p>'+esc(g.be)+'</p>';
        if(g.why)out+='<h4>💭 ゴールの理由</h4><p>'+esc(g.why)+'</p>';
        out+='<div class="fine">期限：'+esc(g.deadline||'未設定')+' ・ 最終更新：'+esc(g.updated||'—')+' ・ 最終確認：'+esc(g.checked||'—')+'</div></article>';
      }
      out+='</div></div>';
    }
    out+='</section><section class="form-panel"><div class="panelh"><h3>変更履歴</h3><span class="chip gray">'+history.length+'件</span></div>';
    out+='<p class="muted-text">変更のたびに、当時の定性・定量ゴールや期限、未来の景色を記録します。履歴は上書きせず、新しいバージョンとして追加します。</p>';
    const filtered=history.filter(h=>(goalPeriodFilter==='all'||h.period===goalPeriodFilter)&&(goalThemeFilter==='all'||h.theme===goalThemeFilter)).slice().sort((a,b)=>String(b.at).localeCompare(String(a.at)));
    if(!filtered.length)out+='<p class="empty">まだ変更履歴はありません。最初のゴール登録から履歴を残していこう。</p>';
    for(const h of filtered.slice(0,15)){
      out+='<div class="goal-history-item"><div class="fine">'+esc(h.at||'日付未設定')+' ・ '+esc(h.period||'')+' ・ '+esc(h.action||'')+'</div><strong>'+esc(h.theme||'テーマ未設定')+'</strong><p>定性：'+esc(h.qualitative||'—')+'\n定量：'+esc(h.quantitative?(h.quantitative+(h.unit?' '+h.unit:'')):'—')+'\n期限：'+esc(h.deadline||'—')+'</p>'+(h.reason?'<p>更新理由：'+esc(h.reason)+'</p>':'')+'</div>';
    }
    if(filtered.length>15&&link)out+='<p class="muted-text">残りの履歴はGoogle Sheetsの「ゴール履歴」タブで確認できます。</p>';
    out+='</section><section class="form-panel"><div class="panelh"><h3>定期確認の履歴</h3><span class="chip gray">'+checks.length+'件</span></div>';
    out+='<p class="muted-text">見直して「変更なし」だった日も別の履歴として残せます。毎週日曜の確認後、記録を残したいときはChatGPTに保存を指示してください。</p>';
    const crows=checks.filter(c=>(goalPeriodFilter==='all'||c.period===goalPeriodFilter)&&(goalThemeFilter==='all'||c.theme===goalThemeFilter)).slice().sort((a,b)=>String(b.at).localeCompare(String(a.at)));
    out+=crows.length?crows.slice(0,8).map(c=>'<div class="goal-history-item"><div class="fine">'+esc(c.at||'')+' ・ '+esc(c.period||'')+'</div><strong>'+esc(c.theme||'')+'：'+esc(c.result||'確認')+'</strong>'+(c.note?'<p>'+esc(c.note)+'</p>':'')+'</div>').join(''):'<p class="empty">まだ定期確認の記録はありません。</p>';
    out+='</section><section class="form-panel"><details><summary style="cursor:pointer;font-weight:850">以前のゴールメモ（この端末内・旧形式）</summary><div class="info">この4項目は以前のバージョンの端末保存メモです。スマホとPCでは共有されません。正式な期間別ゴールは上の「ゴール一覧」に登録してください。既存のメモは削除せず残しています。</div>';
    out+=goalField('title','旧 MY GOAL','','',2,true)+goalField('scene','旧 未来の景色','','',3)+goalField('identity','旧 在り方（BE）','','',3)+goalField('why','旧 ゴールの理由','','',3);
    out+='</details><div class="foot-actions">'+button('JSONでこの端末をバックアップ','export','secondary')+'</div></section></div>';
    return out;
  }

  function loadSyncConfig(){try{const c=JSON.parse(localStorage.getItem(SYNC_KEY)||'{}');return {sheetId:cleanString(c.sheetId||''),clientId:cleanString(c.clientId||DEFAULT_OAUTH_CLIENT_ID),lastSync:cleanString(c.lastSync||''),lastCount:Number(c.lastCount)||0,lastMethod:cleanString(c.lastMethod||'')};}catch(e){return {sheetId:'',clientId:DEFAULT_OAUTH_CLIENT_ID,lastSync:'',lastCount:0,lastMethod:''}}}

  function saveWriteBaseline(){try{localStorage.setItem(WRITE_BASELINE_KEY+syncConfig.sheetId,JSON.stringify(writeBaseline));return true;}catch(e){syncStatusMessage('同期結果の基準情報を端末に保存できませんでした。JSONバックアップを作成してください');return false;}}
  function protectOriginalLocalData(){
    if(writeBaseline)return;
    const key=PRE_SYNC_BACKUP_KEY+syncConfig.sheetId;
    try{
      if(localStorage.getItem(key))return;

  function reconcileActionOverlays(rows){

            syncStatusMessage('Google Sheetsの最新データと変更の競合を確認中…');

  // Opt-in automatic synchronization. Google GIS token requests open a popup and
  // must be initiated by a click. Background attempts get blocked on iOS/Chrome.
  // Show a persistent one-tap reconnect notice instead of repeatedly trying
  // popups on page load, focus or token expiry. Tokens remain memory-only.
  function updateAutoSyncNotice(){
    const el=document.getElementById('autoSyncNotice');
    if(!el)return;
    if(!autoSyncEnabled){el.hidden=true;return;}
    if(autoWriteToken&&Date.now()>=autoTokenExpiresAt){
      autoWriteToken=false;googleToken='';
    }
    const needsAuth=!autoWriteToken||!googleToken;
    const pending=autoPending();
    let message='',action='',style='';
    if(autoSyncBlocked){
      style='error';
      message='安全のため自動同期を停止中です。端末の記録は保持されています。Google連携で競合・エラーを確認してください。';
      action=button('Google連携を確認','go-sync','outline');
    }else if(autoAuthBusy){
      style='warning';
      message='Googleとの接続を確認中です。端末内の記録は保持されています。';
    }else if(needsAuth){
      style='warning';
      const cloudReady=Boolean(cloudWorkerUrl&&cloudSession);
      message=(cloudReady?'Googleとの接続を復旧できませんでした。':'Googleへの接続が必要です。')+(pending?'未送信の変更はこの端末に保存されています。':'端末内の記録は保持されています。')+(cloudReady?' 自動復旧を再試行できます。':cloudWorkerUrl?' 初回だけGoogleでログインしてください。':'');
      action=button(cloudReady?'自動接続を再試行':cloudWorkerUrl?'Googleに初回接続':'Googleに再接続','reconnect-auto-sync','outline');
    }else if(writeBusy){
      message='Google Sheetsに保存中です。端末の記録は保持されています。';
    }else if(syncBusy){
      message='Google Sheetsから最新の記録を確認中です。';
    }else if(pending){
      message='端末に保存済み。Google Sheetsへの自動保存を待っています。';
    }else{
      const last=syncConfig.lastSync?new Date(syncConfig.lastSync).toLocaleTimeString('ja-JP',{timeZone:'Asia/Tokyo'}):'未実施';
      message='自動同期オン｜前回の同期：'+last+'。';
    }
    el.hidden=false;
    el.className='auto-sync-notice'+(style?' '+style:'');
    el.innerHTML='<span>'+esc(message)+'</span>'+action;
  }
  function editingControlFocused(){
    const el=document.activeElement;
    return Boolean(el&&el.matches('input,textarea,select,[contenteditable="true"]'));
  }
  function localEditsWithoutBaseline(){
    return Object.values(data.entries||{}).some(e=>e&&(
      fieldNames.some(k=>txt(e[k]))||e.minimumDone||e.valuableDone||e.reviewed||e.lessonReviewed
    ))||(data.progress?.actions||[]).length>0;
  }
  function autoPending(){
    return writeBaseline?GoalWriteback.countPending(data,writeBaseline):(localEditsWithoutBaseline()?1:0);
  }
  function scheduleAutoSave(){
    if(!autoSyncEnabled)return;
    updateAutoSyncNotice();
    if(autoSyncBlocked||!autoWriteToken||!googleToken||!autoPending())return;
    clearTimeout(autoSaveTimer);
    autoSaveTimer=setTimeout(()=>{autoSyncTick();},Math.max(1800,autoRetryAfter-Date.now()));
  }
  function applyRemoteClears(rows){
    // The original importer intentionally keeps empty cells. For records with a
    // verified baseline, however, an empty remote cell is a real deletion.
    if(!writeBaseline)return;
    for(const row of (rows||[]).slice(1)){
      const date=normalizeDateValue(row[0]),e=data.entries[date];
      if(!date||!e||!writeBaseline.work?.[date])continue;
      for(const [ix,key] of Object.entries(GoalWriteback.workFields)){
        const value=String(row[Number(ix)]??'');
        if(['minimumDone','valuableDone','reviewed','lessonReviewed'].includes(key)){
          e[key]=parseCheckbox(value)===true;
        }else if(!value){
          e[key]='';
        }
      }
    }
  }
  function mergeAfterAutoCommit(workRows,actionRows,snapshot,previousBaseline){
    // Merge server changes only where the user has not typed something newer
    // while the save request was in flight. Never promote stale local values
    // into a fresh baseline (that could undo edits from another device).
    const boolKeys=new Set(['minimumDone','valuableDone','reviewed','lessonReviewed']);
    const workBefore=previousBaseline?.work||{};
    for(const row of (workRows||[]).slice(1)){
      const date=normalizeDateValue(row[0]);
      if(!date||!row.slice(1).some(v=>String(v??'').trim()))continue;
      const current=entry(date),saved=snapshot.entries?.[date]||{};
      for(const [ixText,key] of Object.entries(GoalWriteback.workFields)){
        const ix=Number(ixText),isBool=boolKeys.has(key);
        const norm=v=>isBool?(parseCheckbox(v)===true?'TRUE':'FALSE'):String(v??'');
        const before=workBefore[date]?norm(workBefore[date][ix]):null;
        const snap=norm(saved[key]),now=norm(current[key]),remote=norm(row[ix]);
        if(now===snap&&(before===null||snap===before||snap===remote)){
          current[key]=isBool?(remote==='TRUE'):cleanString(remote);
        }
      }
    }
    const actionBefore=previousBaseline?.actions||{};
    const actionSaved=new Map((snapshot.progress?.actions||[]).map(a=>[a.id,a]));
    const actionRowsMap=new Map((actionRows||[]).slice(1).filter(r=>r[0]).map(r=>[r[0],r]));
    for(const a of (data.progress?.actions||[])){
      const row=actionRowsMap.get(a.id),saved=actionSaved.get(a.id)||{};
      if(!row)continue;
      for(const [ixText,key] of Object.entries(GoalWriteback.actionFields)){
        const ix=Number(ixText);
        if(ix===0)continue;
        const before=actionBefore[a.id]?String(actionBefore[a.id][ix]??''):null;
        const snap=String(saved[key]??''),now=String(a[key]??''),remote=String(row[ix]??'');
        if(now===snap&&(before===null||snap===before||snap===remote))a[key]=remote;
      }
    }
    GoalProgress.importSheet('アクション一覧',actionRows,data,save);
    save();
    if(!editingControlFocused())render();
  }
  async function autoCommit(){
    if(writeBusy||syncBusy||!autoWriteToken||!googleToken)return;
    writeBusy=true;
    try{
      syncStatusMessage('変更をGoogle Sheetsへ自動保存しています…');
      protectOriginalLocalData();
      // Snapshot: edits typed while a request is running must not be marked saved.
      const snapshot=JSON.parse(JSON.stringify(data));
      const previousBaseline=writeBaseline;
      const result=await GoalWriteback.commit({
        sheetId:syncConfig.sheetId,token:googleToken,data:snapshot,baseline:writeBaseline
      });
      writeBaseline=GoalWriteback.baselineFromRows(result.workRows,result.actionRows);
      if(!saveWriteBaseline())throw Error('同期の基準情報を保存できませんでした');
      syncConfig.lastSync=new Date().toISOString();
      syncConfig.lastMethod='自動保存';
      saveSyncConfig();
      mergeAfterAutoCommit(result.workRows,result.actionRows,snapshot,previousBaseline);
      autoRetryAfter=0;
      syncStatusMessage('自動保存完了：'+new Date().toLocaleTimeString('ja-JP',{timeZone:'Asia/Tokyo'}));
    }catch(error){
      autoRetryAfter=Date.now()+60000;
      if(/変更が重複|見出しが想定と違|同じID／日付/.test(error.message))autoSyncBlocked=true;
      if(/API 401|API 403/.test(error.message)){autoWriteToken=false;googleToken='';}
      syncStatusMessage('自動保存を停止しました：'+error.message+'。記録はこの端末に残っています。');
    }finally{
      writeBusy=false;
      updateAutoSyncNotice();
      if(!autoSyncBlocked&&autoWriteToken&&autoPending())scheduleAutoSave();
    }
  }
  async function autoSyncTick(){
    if(!autoSyncEnabled||autoSyncBlocked||syncBusy||writeBusy||document.hidden||Date.now()<autoRetryAfter)return;
    if((!autoWriteToken||!googleToken||Date.now()>=autoTokenExpiresAt)&&cloudWorkerUrl&&cloudSession){
      restoreCloudSession();return;
    }
    if(!autoWriteToken||!googleToken)return;
    if(Date.now()>=autoTokenExpiresAt){
      autoWriteToken=false;googleToken='';
      syncStatusMessage('Google認証の期限が切れました。再接続すると同期を再開できます。');
      return;
    }
    try{
      if(!/^[A-Za-z0-9_-]{20,}$/.test(txt(syncConfig.sheetId))){
        await syncPrivateSheetSettings();
      }
      if(autoPending())await autoCommit();
      else if(!editingControlFocused()){
        autoSilentSync=true;
        try{await fetchSheetRows();}finally{autoSilentSync=false;}
      }
    }catch(error){
      syncStatusMessage('自動同期を保留：'+error.message);
    }
  }

  // The Worker stores the Google refresh token encrypted. Only a random,
  // revocable app session persists in this browser. Access tokens stay in RAM.
  function validCloudWorkerUrl(raw){
    try{
      const u=new URL(String(raw||'').trim());
      return u.protocol==='https:'&&!u.username&&!u.password&&!u.search&&!u.hash&&(u.pathname==='/'||u.pathname==='')?u.origin:'';
    }catch(e){return '';}
  }
  function startCloudAuth(){
    if(!cloudWorkerUrl){go('sync');syncStatusMessage('先にCloudflare WorkerのHTTPS URLを設定してください');return;}
    if(!confirm('初回のみGoogleにログインします。認証後はこのアプリへ戻り、自動同期を開始します。続けますか？'))return;
    location.assign(cloudWorkerUrl+'/auth/start');
  }
  async function restoreCloudSession(){
    if(!autoSyncEnabled||!cloudWorkerUrl||!cloudSession||autoAuthBusy||document.hidden)return;
    autoAuthBusy=true;
    updateAutoSyncNotice();
    try{
      const res=await fetch(cloudWorkerUrl+'/auth/token',{
        headers:{Authorization:'Bearer '+cloudSession},cache:'no-store'
      });
      if(!res.ok){
        if(res.status===401){
          cloudSession='';
          try{localStorage.removeItem(CLOUD_SESSION_KEY);}catch(e){}
          throw Error('Googleのログイン期限が切れました。Google連携からもう一度ログインしてください');
        }
        throw Error('認証サーバーに接続できません（'+res.status+'）');
      }
      const body=await res.json();
      if(!body.access_token)throw Error('Googleの認証情報を取得できませんでした');
      googleToken=body.access_token;
      autoWriteToken=true;
      autoTokenExpiresAt=Date.now()+Math.max(60,(Number(body.expires_in)||3600)-90)*1000;
      autoRetryAfter=0;
      if(tab==='sync')render();
    }catch(error){
      autoWriteToken=false;googleToken='';
      autoRetryAfter=Date.now()+60000;
      syncStatusMessage('自動接続を保留：'+error.message);
    }finally{
      autoAuthBusy=false;
      updateAutoSyncNotice();
    }
    if(autoWriteToken)autoSyncTick();
  }
  async function handleCloudAuthReturn(){
    const params=new URLSearchParams(location.hash.replace(/^#/,''));
    const ticket=params.get('goal_auth_ticket'),error=params.get('goal_auth_error');
    if(!ticket&&!error)return false;
    history.replaceState(null,'',location.pathname+location.search);
    if(error){showToast('Google接続：'+error);return true;}
    if(!cloudWorkerUrl){showToast('Cloudflare WorkerのURLが未設定です。Google連携で設定してください');return true;}
    autoAuthBusy=true;updateAutoSyncNotice();
    try{
      let res;
      for(let attempt=0;attempt<3;attempt++){
        res=await fetch(cloudWorkerUrl+'/auth/finish',{
          method:'POST',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({ticket}),cache:'no-store'
        });
        if(res.status!==409)break;
        await new Promise(resolve=>setTimeout(resolve,600*(attempt+1)));
      }
      if(!res.ok)throw Error('ログイン結果を受け取れませんでした（'+res.status+'）');
      const body=await res.json();
      if(!/^[A-Za-z0-9_-]{43}$/.test(body.session||''))throw Error('ログイン結果の形式が不正です');
      cloudSession=body.session;
      localStorage.setItem(CLOUD_SESSION_KEY,cloudSession);
      autoSyncEnabled=true;
      localStorage.setItem(AUTO_SYNC_KEY,'1');
      autoRetryAfter=0;
      showToast('Googleに接続しました。次回からは自動接続します');
    }catch(error){
      showToast('Googleログイン失敗：'+error.message);
    }finally{
      autoAuthBusy=false;
      updateAutoSyncNotice();
    }
    if(cloudSession&&autoSyncEnabled)restoreCloudSession();
    return true;
  }
  function tryAutoConnect(interactive){
    if(cloudWorkerUrl){
      if(cloudSession){autoSyncEnabled=true;try{localStorage.setItem(AUTO_SYNC_KEY,'1');}catch(e){}autoRetryAfter=0;restoreCloudSession();}
      else if(interactive)startCloudAuth();
      return;
    }
    // OAuth popups require a user gesture. Do not start them in a background timer.
    if(!interactive||autoAuthBusy)return;
    if(!window.google?.accounts?.oauth2){
      syncStatusMessage('Google認証を読み込めません。ネット接続を確認してください');
      return;
    }
    const clientId=txt(syncConfig.clientId||DEFAULT_OAUTH_CLIENT_ID);
    if(!/^[a-zA-Z0-9_-]+\.apps\.googleusercontent\.com$/.test(clientId))return;
    autoAuthBusy=true;
    updateAutoSyncNotice();
    try{
      const client=google.accounts.oauth2.initTokenClient({
        client_id:clientId,
        scope:'https://www.googleapis.com/auth/spreadsheets https://www.googleapis.com/auth/drive.appdata',
        callback:(response)=>{
          autoAuthBusy=false;
          if(!response?.access_token){
            syncStatusMessage('Googleの認証が完了していません。画面上部の「Googleに再接続」を押してください。');
            return;
          }
          googleToken=response.access_token;
          autoWriteToken=true;
          autoTokenExpiresAt=Date.now()+Math.max(60,(Number(response.expires_in)||3600)-90)*1000;
          autoSyncEnabled=true;
          autoSyncBlocked=false;
          autoRetryAfter=0;
          try{localStorage.setItem(AUTO_SYNC_KEY,'1');}catch(e){}
          if(tab==='sync')render();
          updateAutoSyncNotice();
          autoSyncTick();
        },
        error_callback:(error)=>{
          autoAuthBusy=false;
          syncStatusMessage('Googleへの再接続が必要です：'+(error?.type||'認証エラー'));
        }
      });
      client.requestAccessToken({prompt:''});
    }catch(error){
      autoAuthBusy=false;
      syncStatusMessage('Google認証の開始に失敗：'+error.message);
    }
  }
  function disableAutoSync(){
    autoSyncEnabled=false;autoWriteToken=false;autoSyncBlocked=false;googleToken='';

  function renderSync(){const connected=Boolean(googleToken);return header('ChatGPTとGoogle Sheetsをつなぐ','朝の宣言も、夜の振り返りも。会話の結果をこのアプリへ取り込もう。')+`<div class="stack">
   <section class="form-panel"><div class="panelh"><h3>① 記録先のGoogleスプレッドシート</h3><span class="chip gray">自分だけの設定</span></div><p class="muted-text">シートは非公開のままで大丈夫。Google SheetsのURLにある <code>/d/</code> と <code>/edit</code> の間のIDだけをここに入力してください。設定はまずブラウザー内に保存し、Google接続時にGoogle Driveのアプリ専用領域へ安全に共有します。GitHubの公開コードには含まれません。</p><div class="field"><label for="sheetId">GoogleスプレッドシートのID</label><input id="sheetId" type="text" maxlength="4000" data-config="sheetId" placeholder="シートのURLにある長い英数字" value="${esc(syncConfig.sheetId)}" autocomplete="off"></div><div class="sync-kv"><div><strong>セルフエフィカシーワーク記録</strong><div class="sync-small">朝の記録・夜の振り返り・講義の学びを同期</div></div>${/^[a-zA-Z0-9_-]{20,}$/.test(syncConfig.sheetId)?`<a class="button outline" href="https://docs.google.com/spreadsheets/d/${encodeURIComponent(syncConfig.sheetId)}/edit" target="_blank" rel="noopener noreferrer">シートを開く ↗</a>`:'<span class="smallmuted">シートIDを入力してください</span>'}</div></section>
   <section class="form-panel"><div class="panelh"><h3>② Googleから記録を同期</h3><span class="${connected?'chip':'chip gray'}">${connected?'この画面では認証済み':'Google認証が必要'}</span></div><p class="muted-text">初回だけGoogleでログインし、その後はCloudflare Workerが安全に認証を更新します。Googleの更新用トークンはWorker側で暗号化して保管し、端末には失効可能なアプリ用セッションのみ保存します。Googleの許可範囲はSheets全体ですが、このアプリは設定したシートを読み書きします。</p><div class="field"><label for="workerUrl">Cloudflare WorkerのURL（初回のみ設定）</label><p class="hint">例：https://goal-tassei-auth.example.workers.dev　Workerを先に公開し、Google CloudでリダイレクトURIを登録してください。<a href="https://github.com/nao-office/goal-tassei-kun/blob/main/worker/README.md" target="_blank" rel="noopener noreferrer">設定手順</a></p><input id="workerUrl" type="url" data-config="workerUrl" placeholder="https://xxxx.workers.dev" value="${esc(cloudWorkerUrl)}" autocomplete="off"></div><div class="field"><label for="clientId">Google Cloudで作成したOAuthクライアントID</label><p class="hint">従来のブラウザー認証用（Cloudflare Worker方式では入力不要）。Google Sheets APIとGoogle Drive APIは引き続き有効にしてください。</p><input id="clientId" type="text" maxlength="4000" data-config="clientId" placeholder="123456789-xxxx.apps.googleusercontent.com" value="${esc(syncConfig.clientId)}" autocomplete="off"></div><div class="foot-actions">${button('Googleに接続して同期 ↻','google-sync','dark')}${button('Google Sheetsに保存して同期 ↑','save-writeback','secondary')}${button(autoSyncEnabled?(autoSyncBlocked||!autoWriteToken?'自動同期を再接続':'自動同期を停止'):'自動同期を有効にする','toggle-auto-sync','secondary')}${autoSyncEnabled&&(autoSyncBlocked||!autoWriteToken)?button('自動同期を停止','disable-auto-sync','outline'):''}}${button('端末のJSONバックアップ','export','outline')}${button('バックアップから復元','import','outline')}${button('接続設定の説明','setup-guide','outline')}</div><p class="sync-small">ローカルの file:// で開いた場合はGoogle認証が動作しません。GitHub PagesなどのHTTPSサイトに公開してから利用してください。自動同期を有効にすると、入力後に自動保存し、画面表示中は約2分ごと・再表示時に最新データを読み込みます。Worker方式なら最初のGoogleログイン後は、ページを開いたときや認証期限前に自動復旧します。Googleの許可取り消し・長期間の未使用などでは再ログインが必要です。Worker未設定の場合は従来方式のため再接続が必要です。シートIDは最初に連携した端末からGoogle Driveのアプリ専用領域に保存され、同じGoogleアカウントで別端末からログインすると自動取得します。Google Drive APIの有効化が必要です。</p></section>

  function normalizeDateValue(v){let s=String(v??'').trim();const m=s.match(/^(\d{4})[-\/]([01]?\d)[-\/]([0-3]?\d)$/);if(!m)return '';const d=`${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;const dt=new Date(d+'T12:00:00+09:00');if(Number.isNaN(+dt)||isoJst(dt)!==d)return '';return d;}

  function mergeSheetRows(rows,method){
    if(!Array.isArray(rows)||!rows.length)throw Error('シートに見出しがありません');

    if(top.length>EXPECTED_HEADERS.length&&EVENING_HEADERS.some((v,i)=>top[i+18]!==v))throw Error('夜の振り返り列（S～X）の見出しが一致しません');
    const fieldMap={1:'fit',2:'normal',3:'futureAction',4:'valuableAction',5:'minimumAction',6:'withoutAction',9:'achievement',10:'growth',11:'tomorrow'};
    const boolMap={7:'minimumDone',8:'valuableDone',12:'reviewed'};
    const incoming=rows.slice(1);if(incoming.length>5000)throw Error('一度に同期できるのは最大5,000行です');
    let datesSeen=new Set(),latest='',goalVals={};
    incoming.forEach(r=>{
      const date=normalizeDateValue(r[0]);if(!date)return;
      // 朝の欄が空でも、夜だけの回答なら新規記録として取り込む。
      if(!r.slice(1,24).some(v=>txt(v)))return;
      const e=entry(date);
      Object.entries(fieldMap).forEach(([idx,key])=>{const v=String(r[Number(idx)]??'');if(txt(v))e[key]=cleanString(v)});
      Object.entries(boolMap).forEach(([idx,key])=>{const v=parseCheckbox(r[Number(idx)]);if(v===true)e[key]=true;else if(v===false&&e[key]!==true)e[key]=false});
      const snapshot=txt(r[13]);if(snapshot)e.goalSnapshot=cleanString(snapshot);
      const id=txt(r[18]);if(id)e.lessonId=cleanString(id);
      const title=txt(r[19]);if(title)e.lessonTitle=cleanString(title);
      const reflection=txt(r[20]);if(reflection)e.lessonReflection=cleanString(reflection);
      const next=txt(r[21]);if(next)e.lessonNextStep=cleanString(next);
      const lessonDone=parseCheckbox(r[22]);if(lessonDone===true)e.lessonReviewed=true;
      else if(lessonDone===false&&e.lessonReviewed!==true)e.lessonReviewed=false;
      // 日付・テーマ別に復習内容を保持する。既存の達成済みは誤って解除しない。
      const lessonId=txt(e.lessonId);
      if(lessonId&&(reflection||next||lessonDone===true)){
        if(!e.lessonNotes||typeof e.lessonNotes!=='object')e.lessonNotes={};
        const n=e.lessonNotes[lessonId]||{reflection:'',nextStep:'',reviewed:false};
        if(reflection)n.reflection=cleanString(reflection);
        if(next)n.nextStep=cleanString(next);
        if(lessonDone===true)n.reviewed=true;
        e.lessonNotes[lessonId]=n;
      }

  function mergeLessonRows(rows,method){if(!Array.isArray(rows)||!rows.length)throw Error('講義の学びシートに見出しがありません');const header=rows[0].map(v=>String(v??'').replace(/^\uFEFF/,'').trim());if(LESSON_HEADERS.some((v,i)=>v!==header[i]))throw Error('講義の学びシートの見出しが違います');const map=new Map(data.lessons.map(l=>[l.id,l]));let count=0;rows.slice(1,1501).forEach(r=>{const id=txt(r[0]).slice(0,100),title=txt(r[2]);if(!id||!title)return;const obj={id,day:cleanString(r[1]),title:cleanString(r[2]),summary:cleanString(r[3]),question:cleanString(r[4]),action:cleanString(r[5]),source:cleanString(r[6]),url:typeof r[7]==='string'&&r[7].startsWith('https://')?r[7].slice(0,700):''};map.set(id,obj);count++;});data.lessons=[...map.values()].slice(0,800);save();render();showToast(`${count}件の学びを${method}から取り込みました！`);return count;}

  function parseCsv(text){const rows=[];let row=[],value='',quotes=false;const src=String(text||'').replace(/^\uFEFF/,'');for(let i=0;i<src.length;i++){let c=src[i];if(quotes){if(c==='"'){if(src[i+1]==='"'){value+='"';i++;}else quotes=false;}else value+=c;}else if(c==='"')quotes=true;else if(c===','){row.push(value);value='';}else if(c==='\n'||c==='\r'){if(c==='\r'&&src[i+1]==='\n')i++;row.push(value);if(row.some(v=>v!==''))rows.push(row);row=[];value='';}else value+=c;}if(quotes)throw Error('CSVの引用符の形式が正しくありません');if(value!==''||row.length){row.push(value);rows.push(row)}return rows;}
  function syncStatusMessage(msg){const el=document.getElementById('syncStatus');if(el)el.textContent=msg;updateAutoSyncNotice();}
  async function syncPrivateSheetSettings(){
    // Store only the private spreadsheet ID in the authenticated user's Drive appDataFolder.
    // The appData scope does not grant access to ordinary Drive documents.
    const root='https://www.googleapis.com/drive/v3/files';
    const headers={Authorization:'Bearer '+googleToken};
    const params=new URLSearchParams({spaces:'appDataFolder',q:"name = '"+APPDATA_SETTINGS_NAME+"' and trashed = false",fields:'nextPageToken,files(id,name,appProperties)',pageSize:'100'});
    const response=await fetch(root+'?'+params,{headers});
    if(!response.ok)throw Error('端末間の設定共有が利用できません（Google Drive API：'+response.status+'）。Google CloudでGoogle Drive APIが有効か確認してください');
    const body=await response.json();
    if(body.nextPageToken)throw Error('Google Drive内のアプリ設定が多すぎるため自動選択できません');
    const files=(body.files||[]).filter(x=>x.name===APPDATA_SETTINGS_NAME);
    if(files.length>1)throw Error('Google Drive内に設定ファイルが複数あります。自動選択せず確認してください');
    const localId=txt(syncConfig.sheetId);
    if(files.length){
      const remoteId=txt(files[0].appProperties?.sheetId);
      if(!/^[a-zA-Z0-9_-]{20,}$/.test(remoteId))throw Error('Google Drive側の保存設定が不正です');
      if(localId&&localId!==remoteId)throw Error('この端末のシートとGoogle Driveの保存先が異なります。上書きせず停止しました');
      if(!localId){syncConfig.sheetId=remoteId;saveSyncConfig();}
      return;
    }
    if(!/^[a-zA-Z0-9_-]{20,}$/.test(localId))throw Error('最初の端末でシートIDを1回設定してから、Googleに接続して同期してください');
    const created=await fetch(root+'?fields=id',{method:'POST',headers:{...headers,'Content-Type':'application/json'},body:JSON.stringify({name:APPDATA_SETTINGS_NAME,mimeType:'application/json',parents:['appDataFolder'],appProperties:{sheetId:localId}})});
    if(!created.ok)throw Error('Google Driveに同期設定を保存できませんでした（'+created.status+'）');
  }
  async function fetchSheetRows(){
    if(syncBusy||writeBusy)return;
    if(writeBaseline && GoalWriteback.countPending(data,writeBaseline)>0){syncStatusMessage('この端末に未送信の変更があります。先に「Google Sheetsに保存して同期」で保存してください。Google側の記録で上書きしないため、読み込みを停止しました');return;}
    syncBusy=true;syncStatusMessage('非公開のGoogleシートと端末共有設定を確認中…');
    let cloudWarning='';
    try{
      try{await syncPrivateSheetSettings();}
      catch(error){if(!/^[a-zA-Z0-9_-]{20,}$/.test(txt(syncConfig.sheetId)))throw error;cloudWarning=error.message;}
      const sheetId=txt(syncConfig.sheetId);
      if(!/^[a-zA-Z0-9_-]{20,}$/.test(sheetId))throw Error('GoogleスプレッドシートのIDが見つかりません');
      const range=encodeURIComponent("'ワーク記録'!A1:X5001");
      const res=await fetch('https://sheets.googleapis.com/v4/spreadsheets/'+encodeURIComponent(sheetId)+'/values/'+range+'?valueRenderOption=FORMATTED_VALUE',{headers:{Authorization:'Bearer '+googleToken}});
      if(res.status===401){googleToken='';throw Error('ログインの有効期限が切れました。もう一度接続してください');}
      if(!res.ok){let detail='';try{const body=await res.json();detail=body.error?.message||'';}catch(e){}throw Error('シートを読めませんでした（'+res.status+'）'+(detail?'：'+detail:''));}
      const body=await res.json();
      // Check both sheets before mutating local data. Deleted remote rows must
      // never be silently recreated by the next automatic write.
      const actionsOnly=await GoalWriteback.load(sheetId,googleToken);
      if(writeBaseline){
        const workIds=new Set((body.values||[]).slice(1).map(r=>normalizeDateValue(r[0])).filter(Boolean));
        const actionIds=new Set(actionsOnly.actionRows.slice(1).map(r=>String(r[0]??'')).filter(Boolean));
        const deletedWork=Object.keys(writeBaseline.work||{}).filter(id=>!workIds.has(id));
        const deletedActions=Object.keys(writeBaseline.actions||{}).filter(id=>!actionIds.has(id));
        if(deletedWork.length||deletedActions.length){
          autoSyncBlocked=true;
          throw Error('Google Sheets側で記録の行が削除されています。自動上書きせず停止しました。JSONバックアップ後に内容を確認してください');
        }
      }
      protectOriginalLocalData();
      if(writeBaseline&&GoalWriteback.countPending(data,writeBaseline)>0)throw Error('同期中に端末の編集がありました。読み込みを延期します');
      mergeSheetRows(body.values||[],'Google Sheets');
      applyRemoteClears(body.values||[]);
      const lRange=encodeURIComponent("'講義の学び'!A1:H1501");
      const lRes=await fetch('https://sheets.googleapis.com/v4/spreadsheets/'+encodeURIComponent(sheetId)+'/values/'+lRange+'?valueRenderOption=FORMATTED_VALUE',{headers:{Authorization:'Bearer '+googleToken}});
      if(lRes.ok){const lBody=await lRes.json();mergeLessonRows(lBody.values||[],'Google Sheets');}
      else syncStatusMessage('朝のワークは同期済み。講義の学びの取り込みは未完了です（'+lRes.status+'）');
      await fetchGoalSheets(sheetId);
      reconcileActionOverlays(actionsOnly.actionRows);
      writeBaseline=GoalWriteback.baselineFromRows(body.values||[],actionsOnly.actionRows);
      saveWriteBaseline();
      save();
      if(cloudWarning)syncStatusMessage('ワークは同期しましたが、端末間設定共有は未完了：'+cloudWarning);
    }catch(error){syncStatusMessage('同期失敗：'+error.message);showToast('同期に失敗しました。設定を確認してください。');}
    finally{syncBusy=false;}
  }
  function startGoogleSync(){
    if(syncBusy)return;
    if(cloudWorkerUrl&&cloudSession){
      if(googleToken)fetchSheetRows();
      else{autoSyncEnabled=true;try{localStorage.setItem(AUTO_SYNC_KEY,'1');}catch(e){}autoRetryAfter=0;restoreCloudSession();}
      return;
    }
    if(cloudWorkerUrl&&!cloudSession){startCloudAuth();return;}
    const id=txt(syncConfig.clientId||DEFAULT_OAUTH_CLIENT_ID);
    if(!/^[a-zA-Z0-9_-]+\.apps\.googleusercontent\.com$/.test(id)){syncStatusMessage('共通のOAuthクライアントIDが未設定です。設定するまでは既存のIDを入力してください');return;}
    if(location.protocol==='file:'){syncStatusMessage('Google認証は file:// では利用できません。HTTPSでアプリを開いてください');return;}
    if(!window.google?.accounts?.oauth2){syncStatusMessage('Google認証ライブラリを読み込めません。ネット接続とブロック設定を確認してください');return;}
    if(googleToken){fetchSheetRows();return;}
    try{
      const client=google.accounts.oauth2.initTokenClient({
        client_id:id,
        scope:'https://www.googleapis.com/auth/spreadsheets.readonly https://www.googleapis.com/auth/drive.appdata',
        callback:(response)=>{if(!response?.access_token){syncStatusMessage('Googleアカウントの許可が得られませんでした');return;}googleToken=response.access_token;fetchSheetRows();},
        error_callback:(error)=>{syncStatusMessage('Google認証を完了できませんでした：'+(error?.type||'unknown'));}
      });
      client.requestAccessToken();
    }catch(error){syncStatusMessage('Google認証を開始できません：'+error.message);}
  }

  function exportData(){const json=JSON.stringify({...data,exportedAt:new Date().toISOString()},null,2);const blob=new Blob([json],{type:'application/json;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`mirai-goal-backup-${jstToday()}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);showToast('バックアップをダウンロードしました。')}
  function restoreBackupFile(file){
    if(file.size>2_000_000){showToast('ファイルが大きすぎます（2MB以下）。');return;}
    const reader=new FileReader();
    reader.onload=()=>{
      let restoredData;
      try{
        const parsed=JSON.parse(String(reader.result));
        if(!parsed||parsed.version!==1||!parsed.entries||typeof parsed.entries!=='object'||Array.isArray(parsed.entries)||!parsed.goal||typeof parsed.goal!=='object'||Array.isArray(parsed.goal))throw Error('形式');
        restoredData=normalize(parsed);
      }catch(err){
        showToast('このファイルは読み込めません。アプリのJSONバックアップを選んでください。');
        return;
      }
      if(!confirm('現在の記録を読み込んだバックアップで置き換えます。続けますか？'))return;
      const previousData=data;
      data=restoredData;
      if(!save()){
        data=previousData;
        showToast('バックアップを保存できませんでした。現在の記録は変更されていません。ブラウザーの空き容量を確認してください。');
        return;
      }
      go('home');
      showToast('バックアップを読み込みました。');
    };
    reader.onerror=()=>showToast('バックアップファイルを読み込めませんでした。');
    reader.readAsText(file);
  }

  document.addEventListener('change',ev=>{if(GoalProgress.change(progressCtx(),ev))return;const t=ev.target;if(t.matches('[data-goal-theme-filter]')){goalThemeFilter=t.value;render();return;}if(t.matches('[data-check]')){let f=t.dataset.check;if(f!=='minimumDone'&&f!=='valuableDone')return;entry()[f]=t.checked;save();scheduleAutoSave();showToast(t.checked?'一歩を記録しました！':'チェックを更新しました。');}else if(t.id==='csvFile'){const file=t.files?.[0];t.value='';if(!file)return;if(file.size>3_000_000){syncStatusMessage('CSVファイルが大きすぎます（3MB以下）');return;}const reader=new FileReader();reader.onload=()=>{try{mergeSheetRows(parseCsv(String(reader.result)),'CSV');}catch(e){syncStatusMessage('CSV読み込み失敗：'+e.message);showToast('CSV読み込み失敗：'+e.message)}};reader.readAsText(file,'UTF-8');}else if(t.id==='actionSyncCsvFile'){const file=t.files?.[0];t.value='';if(!file)return;if(file.size>3_000_000){showToast('ファイルが大きすぎます');return;}const sheet=pendingActionCsv;const reader=new FileReader();reader.onload=()=>{try{const n=GoalProgress.importSheet(sheet,parseCsv(String(reader.result)),data,save);render();showToast(sheet+'を'+n+'件取り込んだよ');}catch(err){showToast('CSVの読み込みに失敗：'+err.message)}};reader.readAsText(file,'UTF-8');}else if(t.id==='goalIdeasCsvFile'){const file=t.files?.[0];t.value='';if(!file)return;if(file.size>3_000_000){showToast('ゴールの種CSVが大きすぎます');return;}const reader=new FileReader();reader.onload=()=>{try{mergeGoalIdeaRows(parseCsv(String(reader.result)));render();showToast('ゴールの種を読み込みました');}catch(err){showToast('ゴールの種の読み込み失敗：'+err.message)}};reader.readAsText(file,'UTF-8');}else if(t.id==='lessonCsvFile'){const file=t.files?.[0];t.value='';if(!file)return;if(file.size>3_000_000){showToast('CSVファイルが大きすぎます');return;}const reader=new FileReader();reader.onload=()=>{try{mergeLessonRows(parseCsv(String(reader.result)),'CSV');}catch(err){showToast('学びの読み込み失敗：'+err.message)}};reader.readAsText(file,'UTF-8');}else if(t.id==='importFile'){const file=t.files?.[0];t.value='';if(!file)return;if(file.size>2_000_000){showToast('ファイルが大きすぎます（2MB以下）。');return;}const reader=new FileReader();reader.onload=()=>{try{const parsed=JSON.parse(String(reader.result));if(!parsed||parsed.version!==1||typeof parsed.entries!=='object'||typeof parsed.goal!=='object')throw Error('形式');if(!confirm('現在の記録を読み込んだバックアップで置き換えます。続けますか？'))return;data=normalize(parsed);save();go('home');showToast('バックアップを読み込みました。')}catch(err){showToast('このファイルは読み込めません。アプリのJSONバックアップを選んでください。')}};reader.readAsText(file);}});
  document.addEventListener('click',ev=>{if(GoalProgress.capture(progressCtx(),ev)){scheduleAutoSave();return;}const ideaButton=ev.target.closest('[data-action="copy-goal-question"]');if(ideaButton){const idea=(data.goalIdeas||[]).find(i=>i.id===ideaButton.dataset.ideaId);if(!idea)return;const prompt=goalIdeaPrompt(idea);if(navigator.clipboard?.writeText){navigator.clipboard.writeText(prompt).then(()=>showToast('深掘り用の文章をコピーしました。ChatGPTの会話に貼り付けてね。')).catch(()=>showToast('コピーできませんでした。質問を会話で伝えてね。'));}else showToast('質問をChatGPTの会話で伝えてね。');return;}const goalFilter=ev.target.closest('[data-goal-filter]');if(goalFilter){goalPeriodFilter=goalFilter.dataset.goalFilter;render();return;}const nav=ev.target.closest('[data-nav]');if(nav){go(nav.dataset.nav);return;}const revDate=ev.target.closest('[data-review-date]');if(revDate){go('evening',revDate.dataset.reviewDate);return;}const history=ev.target.closest('[data-date]');if(history){go('morning',history.dataset.date);return;}const pick=ev.target.closest('[data-lesson-id]');if(pick){const l=data.lessons.find(l=>l.id===pick.dataset.lessonId);if(l){const e=entry();const old=lessonFor(activeDate);if(old&&old.id!==l.id){if(!e.lessonNotes||typeof e.lessonNotes!=='object')e.lessonNotes={};e.lessonNotes[old.id]={reflection:e.lessonReflection||'',nextStep:e.lessonNextStep||'',reviewed:!!e.lessonReviewed};const existing=e.lessonNotes[l.id]||{};e.lessonReflection=existing.reflection||'';e.lessonNextStep=existing.nextStep||'';e.lessonReviewed=existing.reviewed===true;e.lessonId=l.id;e.lessonTitle=l.title;save();scheduleAutoSave();render();showToast('今日の学びを切り替えました');}}return;}const el=ev.target.closest('[data-action]');if(!el)return;switch(el.dataset.action){case'go-home':go('home');break;case'go-goal':go('goal');break;case'go-progress':go('progress');break;case'go-morning':go('morning',tab==='evening'?activeDate:null);break;case'go-evening':go('evening',tab==='morning'?activeDate:null);break;case'go-history':go('history');break;case'go-s
