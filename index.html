  function isoJst(date){const parts=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(date);let p={};parts.forEach(v=>p[v.type]=v.value);return `${p.year}-${p.month}-${p.day}`;}

  function saveGoalForm(button){
    const form=button.closest('[data-goal-form]');
    if(!form)return;
    const fields=new FormData(form),id=txt(form.dataset.goalId)||'g-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8);
    const existing=data.goals.find(goal=>goal.id===id)||null;
    const period=String(fields.get('period')||'');
    const theme=cleanString(fields.get('theme')).trim();
    if(!theme||!GOAL_PERIODS.includes(period)){syncStatusMessage('テーマと期間を確認してください');return;}
    const now=new Date().toISOString();
    const next={
      id,theme,period,qualitative:cleanString(fields.get('qualitative')),quantitative:cleanString(fields.get('quantitative')),
      unit:cleanString(fields.get('unit')),deadline:cleanString(fields.get('deadline')),scene:cleanString(fields.get('scene')),
      be:cleanString(fields.get('be')),why:cleanString(fields.get('why')),status:cleanString(fields.get('status'))||'進行中',
      memo:cleanString(fields.get('memo')),
      created:existing?.created||now,updated:now,checked:existing?.checked||''
    };
    const previous=existing?JSON.parse(JSON.stringify(existing)):null;
    const currentRows=data.goals, currentHistory=data.goalHistory;
    data.goals=existing?data.goals.map(goal=>goal.id===id?next:goal):[...data.goals,next];
    const afterSnapshot=JSON.parse(JSON.stringify(next));
    data.goalHistory=[...data.goalHistory,{
      at:now,id,action:existing?'更新':'作成',theme:next.theme,period:next.period,
      qualitative:next.qualitative,quantitative:next.quantitative,unit:next.unit,deadline:next.deadline,
      scene:next.scene,be:next.be,why:next.why,status:next.status,
      reason:cleanString(fields.get('reason')),previousUpdated:existing?.updated||'',
      source:'ゴール達成くん',eventId:'gh-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,10),
      beforeSnapshot:previous,afterSnapshot
    }];
    if(!save()){
      data.goals=currentRows;data.goalHistory=currentHistory;
      syncStatusMessage('端末への保存に失敗したため、ゴールと変更履歴を元に戻しました');
      return;
    }
    render();
    showToast(existing?'ゴールと変更履歴を保存しました':'ゴールと作成履歴を保存しました');
  }

  function syncDisplayForSheet(){

  function recordSyncCheck(scope,snapshot,baseline,sheetId){
    if(syncDisplayForSheet().sheetId!==sheetId)return;
    const evidence=syncDisplayForSheet()[scope];
    evidence.checkedAt=new Date().toISOString();
    evidence.remoteState=!baseline?'no-baseline':JSON.stringify(snapshot)===JSON.stringify(baseline)?'unchanged':'changed';
    evidence.checkFailed=false;
  }
  function recordSyncCheckFailure(scope,sheetId){if(syncDisplayForSheet().sheetId===sheetId)syncDisplayForSheet()[scope].checkFailed=true;}
  function startSyncSend(scope,sheetId){if(syncDisplayForSheet().sheetId!==sheetId)return;syncDisplayForSheet()[scope].sending=true;updateAutoSyncNotice();}
  function finishSyncSend(scope,count,sheetId){
    if(syncDisplayForSheet().sheetId!==sheetId)return;
    const evidence=syncDisplayForSheet()[scope];
    evidence.sending=false;evidence.sendFailed=false;
    if(count>0){evidence.sentAt=new Date().toISOString();}
  }
  function failSyncSend(scope,sheetId){
    if(syncDisplayForSheet().sheetId!==sheetId)return;
    const evidence=syncDisplayForSheet()[scope];
    // A later local-storage failure must not erase a confirmed API result.
    if(evidence.sending){evidence.sending=false;evidence.sendFailed=true;evidence.checkFailed=true;}
  }
  function syncEvidenceTime(at){return new Date(at).toLocaleString('ja-JP',{timeZone:'Asia/Tokyo'})+'（日本時間）';}
  function syncEvidenceLines(){
    const evidence=syncDisplayForSheet();
    const local=typeof tabGuard!=='undefined'&&tabGuard&&!tabGuard.ready()?'端末保存：このタブの保存は保留中。入力を残しています。':storageError?'端末保存：失敗または未確認。ページを閉じずにJSONバックアップを書き出してください。'

      :'端末保存：まだ保存していません。入力するとこのブラウザーに保存します。';
    const scopes=[['work','ワーク・アクション'],['goals','ゴール管理']];
    const sends=scopes.map(([scope,label])=>{
      const item=evidence[scope];
      return label+'：'+(item.sending?'送信中（完了未確認）':item.sendFailed?'直近の送信処理は未完了・結果未確認。停止理由を確認して再試行してください'

    });
    const checks=scopes.map(([scope,label])=>{
      const item=evidence[scope];
      const state=item.remoteState==='changed'?'同期基準から変更あり（更新元は判定できません）'
        :item.remoteState==='unchanged'?'同期基準からの変更なし':'同期基準がなく変更の有無は未判定';
      return label+'：'+(item.checkFailed?'直近の確認に失敗。現在の状態は未確認。':'')+
        (item.checkedAt?state+'／'+syncEvidenceTime(item.checkedAt)+' 時点':'未確認');

    const pending=writeBaseline?autoPending():null;
    const pendingText=pending===null?'ワーク・アクションの保存済み同期基準はまだありません。自動連係で両方の内容を確認・保管します。'
      :pending?'ワーク・アクションに同期基準と異なる端末の変更があります。'

  }

  async function handleCloudAuthReturn(){

    const ticket=params.get('goal_auth_ticket'),error=params.get('goal_auth_error');
    if(!ticket&&!error)return false;
    history.replaceState(null,'',location.pathname+location.search);
    if(error){showToast('Google接続：'+error);return true;}
    if(!cloudWorkerUrl){showToast('Cloudflare WorkerのURLが未設定です。Google連携で設定してください');return true;}
    autoAuthBusy=true;updateAutoSyncNotice();
    try{
      let res;
      for(let attempt=0;attempt<3;attempt++){
        res=await fetch(cloudWorkerUrl+'/auth/finish',{
          method:'POST',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({ticket}),cache:'no-store'
        });
        if(res.status!==409)break;
        await new Promise(resolve=>setTimeout(resolve,600*(attempt+1)));
      }
      if(!res.ok)throw Error('ログイン結果を受け取れませんでした（'+res.status+'）');
      const body=await res.json();
      if(!/^[A-Za-z0-9_-]{43}$/.test(body.session||''))throw Error('ログイン結果の形式が不正です');
      GoalCloudAuth.saveSession(localStorage,{
        sessionKey:CLOUD_SESSION_KEY,autoSyncKey:AUTO_SYNC_KEY,autoEnableAfterReviewKey:AUTO_ENABLE_AFTER_REVIEW_KEY
      },body.session);
      cloudSession=body.session;
      authNeedsRelogin=false;
      autoSyncEnabled=false;
      autoWriteToken=false;
      googleToken='';googleTokenWritable=false;
      enableAutoAfterReview=false;
      autoRetryAfter=0;
      showToast('Googleに接続しました。「両方残して自動連係」または「ゴールを同期」を選べます。');
    }catch(error){
      showToast('Googleログイン失敗：'+error.message);
    }finally{
      autoAuthBusy=false;
      updateAutoSyncNotice();
    }
    // Authentication only establishes a session. It must not create a hidden
    // review or make an unsolicited Sheets request after returning to Home.
    syncReview=null;syncReviewChoices={};goalReviewChoices={};
    if(tab==='sync')render();
    return true;
  }

  function normalizeDateValue(v){let s=String(v??'').trim();const m=s.match(/^(\d{4})[-\/]([01]?\d)[-\/]([0-3]?\d)$/);if(!m)return '';const d=`${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;const dt=new Date(d+'T12:00:00+09:00');if(Number.isNaN(+dt)||isoJst(dt)!==d)return '';return d;}
  function parseCheckbox(v){const x=String(v??'').trim().toLowerCase();if(['true','yes','はい','済','1','達成'].includes(x))return true;if(['false','no','いいえ','未','0','未達'].includes(x))return false;return null;}
  function mergeSheetRows(rows,method){
    if(!Array.isArray(rows)||!rows.length)throw Error('シートに見出しがありません');
    const top=rows[0].map(v=>String(v??'').replace(/^\uFEFF/,'').trim());
    if(EXPECTED_HEADERS.some((v,i)=>top[i]!==v))throw Error('見出しが一致しません。「ワーク記録」タブのCSVまたは指定シートを使用してください');
    // 旧v0.3の18列CSVは朝の記録として読み込める。夜の復習列が1列でも存在する場合、完全一致を要求。
    if(top.length>EXPECTED_HEADERS.length&&EVENING_HEADERS.some((v,i)=>top[i+18]!==v))throw Error('夜の振り返り列（S～X）の見出しが一致しません');
    const fieldMap={1:'fit',2:'normal',3:'futureAction',4:'valuableAction',5:'minimumAction',6:'withoutAction',9:'achievement',10:'growth',11:'tomorrow'};
    const boolMap={7:'minimumDone',8:'valuableDone',12:'reviewed'};
    const incoming=rows.slice(1);if(incoming.length>5000)throw Error('一度に同期できるのは最大5,000行です');
    let datesSeen=new Set(),latest='',goalVals={};
    incoming.forEach(r=>{
      const date=normalizeDateValue(r[0]);if(!date)return;
      // 朝の欄が空でも、夜だけの回答なら新規記録として取り込む。
      if(!r.slice(1,24).some(v=>txt(v)))return;
      const e=entry(date);
      Object.entries(fieldMap).forEach(([idx,key])=>{const v=String(r[Number(idx)]??'');if(txt(v)&&!txt(e[key]))e[key]=cleanString(v)});
      Object.entries(boolMap).forEach(([idx,key])=>{const v=parseCheckbox(r[Number(idx)]);if(v===true)e[key]=true;else if(v===false&&e[key]!==true)e[key]=false});
      const snapshot=txt(r[13]);if(snapshot&&!txt(e.goalSnapshot))e.goalSnapshot=cleanString(snapshot);
      const id=txt(r[18]);if(id&&!txt(e.lessonId))e.lessonId=cleanString(id);
      const title=txt(r[19]);if(title&&!txt(e.lessonTitle))e.lessonTitle=cleanString(title);
      const reflection=txt(r[20]);if(reflection&&!txt(e.lessonReflection))e.lessonReflection=cleanString(reflection);
      const next=txt(r[21]);if(next&&!txt(e.lessonNextStep))e.lessonNextStep=cleanString(next);
      const lessonDone=parseCheckbox(r[22]);if(lessonDone===true)e.lessonReviewed=true;
      else if(lessonDone===false&&e.lessonReviewed!==true)e.lessonReviewed=false;
      // 日付・テーマ別に復習内容を保持する。既存の達成済みは誤って解除しない。
      const lessonId=txt(e.lessonId);
      if(lessonId&&(reflection||next||lessonDone===true)){
        if(!e.lessonNotes||typeof e.lessonNotes!=='object')e.lessonNotes={};
        const n=e.lessonNotes[lessonId]||{reflection:'',nextStep:'',reviewed:false};
        if(reflection&&!txt(n.reflection))n.reflection=cleanString(reflection);
        if(next&&!txt(n.nextStep))n.nextStep=cleanString(next);
        if(lessonDone===true)n.reviewed=true;
        e.lessonNotes[lessonId]=n;
      }
      if(date>=latest){latest=date;goalVals={title:r[13],scene:r[14],identity:r[15],why:r[16]};}
      datesSeen.add(date);
    });
    if(latest){Object.entries(goalVals).forEach(([key,val])=>{if(txt(val)&&!txt(data.goal[key]))data.goal[key]=cleanString(val)});}
    save();syncConfig.lastSync=new Date().toISOString();syncConfig.lastCount=datesSeen.size;syncConfig.lastMethod=method;saveSyncConfig();render();
    showToast(datesSeen.size?`${datesSeen.size}日分の朝・夜の記録を同期しました！`:'読み込める日付の記録がありませんでした');
    return datesSeen.size;
  }
  function mergeLessonRows(rows,method){
    if(!Array.isArray(rows)||!Array.isArray(rows[0]))throw Error('講義の学びシートに見出しがありません');
    const header=rows[0].map(v=>String(v??'').replace(/^\uFEFF/,'').trim());
    if(LESSON_HEADERS.some((v,i)=>v!==header[i]))throw Error('講義の学びシートの見出しが違います');
    if(rows.length-1>1500)throw Error('一度に読み込める学びは最大1,500行です。今回は追加していません');
    // Build the whole addition before touching live data. Never truncate existing records.
    const previous=data.lessons,seen=new Set(previous.map(lesson=>lesson.id)),additions=[];
    rows.slice(1).forEach((r,index)=>{
      if(!Array.isArray(r))throw Error(`${index+2}行目の形式が正しくありません。今回は追加していません`);
      const id=txt(r[0]),title=txt(r[2]);
      if(!id||!title||seen.has(id))return;
      // Match the reload limits so a successful import also survives the next launch.
      if(id.length>=100)throw Error(`${index+2}行目のIDは99文字以内にしてください。今回は追加していません`);
      if(r.slice(1,7).some(value=>String(value??'').length>4000))throw Error(`${index+2}行目の本文は各項目4,000文字以内にしてください。今回は追加していません`);
      const url=String(r[7]??'');
      if(url&&(url.length>700||!url.startsWith('https://')))throw Error(`${index+2}行目の出典URLはhttps://で始まる700文字以内のURLにしてください。今回は追加していません`);
      additions.push({id,day:cleanString(r[1]),title:cleanString(r[2]),summary:cleanString(r[3]),question:cleanString(r[4]),action:cleanString(r[5]),source:cleanString(r[6]),url});
      seen.add(id);
    });
    if(!additions.length){showToast('新しく追加できる学びはありません。既存の端末記録は変更していません');return 0;}
    if(previous.length+additions.length>800)throw Error(`学びは最大800件です（登録済み${previous.length}件・新規${additions.length}件）。上限を超えるため、今回は追加していません`);
    data.lessons=[...previous,...additions];
    if(!save()){
      data.lessons=previous;
      throw Error('端末に保存できなかったため、学びは追加していません。保存容量などを確認し、同じCSVをもう一度選んでください');
    }
    render();showToast(`${additions.length}件の新しい学びを${method}から追加しました。既存の端末記録は変更していません`);
    return additions.length;
  }

  function mergeGoalIdeaRows(rows){
    if(!rows?.length||GOAL_IDEA_HEADERS.some((v,i)=>String(rows[0]?.[i]??'').trim()!==v))throw Error('ゴールの種の見出しが一致しません');
    const found=new Map();
    for(const r of rows.slice(1,2001)){
      const id=txt(r[0]).slice(0,160);
      if(!id)continue;
      found.set(id,{id,date:cleanString(r[1]),theme:cleanString(r[2]),period:cleanString(r[3]),field:cleanString(r[4]),content:cleanString(r[5]),state:cleanString(r[6])||'要確認',question:cleanString(r[7]),goalId:cleanString(r[8]),source:cleanString(r[9]),updated:cleanString(r[10]),memo:cleanString(r[11])});
    }
    const existing=new Map((data.goalIdeas||[]).filter(x=>x?.id).map(x=>[x.id,x]));
    for(const [id,item] of found)if(!existing.has(id))existing.set(id,item);
    data.goalIdeas=[...existing.values()];
    save();
    return data.goalIdeas.length;
  }
  function activeGoalIdeas(){
    return (data.goalIdeas||[]).filter(i=>i.state!=='ゴール反映済み'&&i.state!=='保留').slice().sort((a,b)=>String(b.updated||b.date).localeCompare(String(a.updated||a.date)));
  }
  function goalIdeaPrompt(idea){
    return '朝のセルフエフィカシーワークは、まず前日の「明日の一歩」を確認し、ほかにやることや変更があるか聞いてから、いつもの4つの問いを順番に進めて。既に答えた問いは繰り返さないで。4つの問いの後、希望する場合だけ、このゴールの材料を1問深掘りして。既に分かっていることは繰り返し質問せず、期限・定性/定量・未来の景色・在り方・理由で不足している項目を確認して。未確定の内容は勝手に正式なゴールとして扱わない。\nテーマ：'+(idea.theme||'未設定')+'\n項目：'+(idea.field||'未設定')+'\n会話で明らかになった内容：'+(idea.content||'')+'\n次の質問：'+(idea.question||'この内容を今も目指したい？');

  function mergeGoalRows(rows){
    if(!rows?.length||GOAL_HEADERS.some((v,i)=>String(rows[0]?.[i]??'').trim()!==v))throw Error('ゴール一覧の見出しが一致しません');
    const list=new Map();
    for(const r of rows.slice(1,1001)){
      const id=txt(r[0]).slice(0,160),period=txt(r[2]);
      if(id===GoalManagementSync.legacyGoalId){
        for(const [key,index] of [['title',3],['scene',7],['identity',8],['why',9]]){
          const value=cleanString(r[index]);
          if(value&&!txt(data.goal[key]))data.goal[key]=value;
        }
        continue;
      }
      if(!id||!GOAL_PERIODS.includes(period))continue;
      list.set(id,{id,theme:cleanString(r[1]),period,qualitative:cleanString(r[3]),quantitative:cleanString(r[4]),unit:cleanString(r[5]),deadline:cleanString(r[6]),scene:cleanString(r[7]),be:cleanString(r[8]),why:cleanString(r[9]),status:cleanString(r[10])||'進行中',created:cleanString(r[11]),updated:cleanString(r[12]),checked:cleanString(r[13]),memo:cleanString(r[14])});
    }
    const existing=new Map((data.goals||[]).filter(x=>x?.id).map(x=>[x.id,x]));

  function mergeGoalHistoryRows(rows){

  function parseCsv(text){const rows=[];let row=[],value='',quotes=false;const src=String(text||'').replace(/^\uFEFF/,'');for(let i=0;i<src.length;i++){let c=src[i];if(quotes){if(c==='"'){if(src[i+1]==='"'){value+='"';i++;}else quotes=false;}else value+=c;}else if(c==='"')quotes=true;else if(c===','){row.push(value);value='';}else if(c==='\n'||c==='\r'){if(c==='\r'&&src[i+1]==='\n')i++;row.push(value);if(row.some(v=>v!==''))rows.push(row);row=[];value='';}else value+=c;}if(quotes)throw Error('CSVの引用符の形式が正しくありません');if(value!==''||row.length){row.push(value);rows.push(row)}return rows;}

  async function fetchSheetRows(scope='recovery'){

    if(syncBusy||syncAuthBusy||autoAuthBusy||writeBusy||autoSyncTickBusy)return;
    const sheetId=txt(syncConfig.sheetId);
    if(!/^[A-Za-z0-9_-]{20,}$/.test(sheetId)){syncStatusMessage('先にGoogle連携画面でスプレッドシートIDを入力してください');return;}
    if(!googleToken){syncStatusMessage('先にGoogleへ接続してください');return;}
    clearManualSyncReview();
    const sequence=syncReviewSequence;pendingManualScope=scope;
    syncBusy=true;
    // Remove old controls immediately, then keep the read scoped to this view.
    render();
    syncStatusMessage(scope==='goals'?'Google Sheetsのゴール管理を読み取り中です…':'Google Sheetsのワーク記録とアクション一覧を読み取り中です…');
    try{
      const rows=scope==='goals'?await GoalManagementSync.load(sheetId,googleToken):await GoalWriteback.load(sheetId,googleToken);
      if(sequence!==syncReviewSequence||tab!=='sync'||(scope==='recovery'&&!syncDetailsOpen))return;

        syncReview={scope,sheetId,goalRows:rows,localSnapshot:JSON.stringify(data),goalGroups:GoalManagementSync.preview(data,goalSyncBaseline,rows)};
        recordSyncCheck('goals',GoalManagementSync.baselineFromRows(rows),goalSyncBaseline,sheetId);

        recordSyncCheck('work',GoalWriteback.baselineFromRows(rows.workRows,rows.actionRows),writeBaseline,sheetId);
      }
      render();
      syncStatusMessage(scope==='goals'?'ゴール管理の差分を表示しました。選択するまで記録は変更しません。':'差分を表示しました。復旧用の個別確認です。選択するまで記録は変更しません。');
    }catch(error){
      if(sequence!==syncReviewSequence)return;
      recordSyncCheckFailure(scope==='goals'?'goals':'work',sheetId);
      syncStatusMessage('差分を確認できませんでした。記録は変更していません：'+error.message);

      try{
        const client=google.accounts.oauth2.initTokenClient({
          client_id:txt(syncConfig.clientId||DEFAULT_OAUTH_CLIENT_ID),
          scope:GoalWriteback.writeScope,
          callback:response=>{
            syncAuthBusy=false;
            if(!response?.access_token){syncStatusMessage('書き込み許可が得られませんでした。Sheetsは変更していません');return;}
            googleToken=response.access_token;googleTokenWritable=true;
            applyReviewedSync();
          },
          error_callback:error=>{syncAuthBusy=false;syncStatusMessage('書き込み許可を確認できませんでした：'+(error?.type||'Google認証エラー'));updateAutoSyncNotice();}
        });
        client.requestAccessToken();
      }catch(error){syncAuthBusy=false;syncStatusMessage('書き込み許可の確認を開始できません：'+error.message);}
      return;
    }
    const sheetId=syncReview.sheetId;
    syncBusy=true;writeBusy=true;
    const previousData=data;
    const candidate=JSON.parse(JSON.stringify(data));
    try{
      if(!saveSafeSyncApproval(false))throw Error('自動同期の安全停止を保存できませんでした。Google Sheetsには書き込みませんでした');
      if(!writeBaseline)protectOriginalLocalData();
      for(const field of fields){
        if(syncReviewChoices[reviewKey(field)]==='sheets'){
          GoalWriteback.applyRemoteField(candidate,field.kind,field.id,field.index,field.remoteValue??'');
        }
      }
      data=candidate;
      const currentBaseline=GoalWriteback.baselineFromRows(syncReview.rows.workRows,syncReview.rows.actionRows);
      startSyncSend('work',sheetId);
      const result=await GoalWriteback.commit({sheetId:syncReview.sheetId,token:googleToken,data,baseline:currentBaseline,
        expectedRows:syncReview.rows});
      finishSyncSend('work',result.count,sheetId);
      if(!save())throw Error('Google Sheets側の処理は完了しましたが、端末への保存に失敗しました。同期は停止しています。再読込前にJSONバックアップを確認してください');
      const nextBaseline=GoalWriteback.baselineFromRows(result.workRows,result.actionRows);

      if(!saveWriteBaseline())throw Error('同期後の基準を保存できませんでした。自動同期は有効にしません');
      syncConfig.lastSync=new Date().toISOString();
      recordSyncCheck('work',nextBaseline,nextBaseline,sheetId);
      syncConfig.lastCount=result.count;
      syncConfig.lastMethod='差分を確認した同期';
      saveSyncConfig();
      if(!saveSafeSyncApproval(true))throw Error('安全確認の状態を保存できません。自動同期は有効にしません');
      if(backupRestoreSyncGuard){
        try{localStorage.removeItem(BACKUP_RESTORE_SYNC_GUARD_KEY);backupRestoreSyncGuard=false;}
        catch(error){throw Error('復元後の安全停止を解除できません。自動同期は停止したままです');}

      showToast('差分を確認して同期しました');

        catch(error){enableAutoAfterReview=false;syncStatusMessage('確認済みですが、自動同期の再開予約を保存領域から削除できません。自動同期は開始しません');return;}
        enableAutoAfterReview=false;tryAutoConnect(true);
      }
    }catch(error){
      failSyncSend('work',sheetId);
      if(data===candidate){
        data=previousData;
        if(!save())syncStatusMessage('同期に失敗し、端末データの復元保存にも失敗しました。ページを閉じず、すぐにJSONバックアップを書き出してください');

      try{localStorage.removeItem(AUTO_ENABLE_AFTER_REVIEW_KEY);}catch(storageError){stopWarning+='自動同期の再開予約も削除できませんでした。';}

    }finally{syncBusy=false;writeBusy=false;updateAutoSyncNotice();}

  function startGoogleSync(scope='recovery'){
    if(typeof tabGuard!=='undefined'&&tabGuard&&!tabGuard.ready()){updateAutoSyncNotice();return;}
    if(syncBusy||syncAuthBusy||autoAuthBusy||writeBusy||autoSyncTickBusy)return;
    if(tab!=='sync')return;
    if(scope==='recovery')syncDetailsOpen=true;
    clearManualSyncReview();
    const sequence=syncReviewSequence;pendingManualScope=scope;
    const read=()=>{if(sequence===syncReviewSequence&&tab==='sync')fetchSheetRows(scope);};
    if(cloudWorkerUrl&&cloudSession){
      if(googleToken)read();
      else connectCloudSessionForManualUse(read);
      return;
    }
    if(cloudWorkerUrl&&!cloudSession){startCloudAuth();return;}
    const id=txt(syncConfig.clientId||DEFAULT_OAUTH_CLIENT_ID);
    if(!/^[a-zA-Z0-9_-]+\.apps\.googleusercontent\.com$/.test(id)){syncStatusMessage('共通のOAuthクライアントIDが未設定です。設定するまでは既存のIDを入力してください');return;}
    if(location.protocol==='file:'){syncStatusMessage('Google認証は file:// では利用できません。HTTPSでアプリを開いてください');return;}
    if(!window.google?.accounts?.oauth2){syncStatusMessage('Google認証ライブラリを読み込めません。ネット接続とブロック設定を確認してください');return;}
    if(googleToken&&(!googleTokenWritable||autoSyncEnabled)){read();return;}
    try{
      syncAuthBusy=true;
      const client=google.accounts.oauth2.initTokenClient({
        client_id:id,
        scope:GoalWriteback.readOnlyScope,
        callback:(response)=>{syncAuthBusy=false;if(!response?.access_token){syncStatusMessage('Googleアカウントの許可が得られませんでした');return;}googleToken=response.access_token;googleTokenWritable=false;read();},
        error_callback:(error)=>{syncAuthBusy=false;syncStatusMessage('Google認証を完了できませんでした：'+(error?.type||'unknown'));}
      });
      client.requestAccessToken();
    }catch(error){syncAuthBusy=false;syncStatusMessage('Google認証を開始できません：'+error.message);}
  }

se'cancel-archive-draft':archiveDraft=null;render();break;case'save-archive-draft':saveArchiveDraft();break;case'retry-local-save':if(save()){scheduleAutoSave();showToast('端末内の記録を再保存しました。編集中のフォームは各画面の保存ボタンで確定してください。');}break;case'go-home':go('home');break;case'go-goal':go('goal');break;case'go-progress':go('progress');break;case'go-morning':go('morning',tab==='evening'?activeDate:null);break;case'go-evening':go('evening',tab==='morning'?activeDate:null);break;case'go-history':go('history');break;case'go-sync':go('sync');break;case'google-sync':startGoogleSync();break;case'reconnect-auto-sync':tryAutoConnect(true);break;case'save-writeback':saveLocalChangesToSheets();break;case'toggle-auto-sync':if(autoSyncEnabled&&autoWriteToken&&!autoSyncBlocked)disableAutoSync();else tryAutoConnect(true);break;case'disable-auto-sync':disableAutoSync();break;case'sync-csv':document.getElementById('csvFile').click();break;case'sync-lessons-csv':document.getElementById('lessonCsvFile').click();break;case'sync-goal-ideas-csv':document.getElementById('goalIdeasCsvFile').click();break;case'sync-action-csv':pendingActionCsv=el.dataset.sheet||'アクション一覧';document.getElementById('actionSyncCsvFile').click();break;case'finish-lesson':{const e=entry();if(!txt(e.lessonReflection)&&!txt(e.lessonNextStep)){showToast('今日の気づきか、明日の実践を1つ書いてね');return;}const previous={lessonId:e.lessonId,lessonReviewed:e.lessonReviewed,lessonNotes:e.lessonNotes};e.lessonId=lessonFor(activeDate).id;e.lessonReviewed=true;e.lessonNotes={...e.lessonNotes,[e.lessonId]:{reflection:e.lessonReflection||'',nextStep:e.lessonNextStep||'',reviewed:true}};if(!save()){Object.assign(e,previous);return;}scheduleAutoSave();render();showToast('今日の学びを復習したね！');break;}case'setup-guide':window.open('https://developers.google.com/identity/oauth2/web/guides/get-google-api-clientid?hl=ja','_blank','noopener,noreferrer');break;case'today':go('morning',jstToday());break;case'confirm-morning':if(!isPlanned(entry())){showToast('一番価値のある行動と最低限の完了ライ   function tabDrafts(){
    return [...document.querySelectorAll('[data-goal-form],#pg-action-form,#pg-review-form')].flatMap(form=>{
      const fields=[...form.querySelectorAll('input,textarea,select')].map(el=>{
        const original=el.tagName==='SELECT'?([...el.options].filter(o=>o.defaultSelected).pop()||el.options[0])?.value:el.defaultValue;
        const dirty=el.type==='checkbox'||el.type==='radio'?el.checked!==el.defaultChecked:el.value!==(original||'');
        return {id:el.id,name:el.name,value:el.value,label:el.selectedOptions?.[0]?.textContent||'',checked:el.checked,type:el.type,dirty};
      });
      return fields.some(f=>f.dirty)?[{form:form.id||'goal:'+form.dataset.goalId,recordId:form.dataset.recordId||form.dataset.goalId||'',formHtml:form.outerHTML,fields}]:[];
    });
  }
  function restoreTabDrafts(drafts){
    for(const draft of drafts){
      const forms=[...document.querySelectorAll('[data-goal-form],#pg-action-form,#pg-review-form')];
      let form=forms.find(f=>(f.id||'goal:'+f.dataset.goalId)===draft.form);
      const missing=!form||(form.dataset.recordId||form.dataset.goalId||'')!==draft.recordId;
      if(missing){
        const holder=document.createElement('section');holder.className='form-panel';
        holder.innerHTML='<p>別タブで変更された記録の編集中の入力です。保存ボタンで残せます。</p>'+draft.formHtml;
        if(form)form.replaceWith(holder);else document.getElementById('app').append(holder);
        form=holder.querySelector('[data-goal-form],#pg-action-form,#pg-review-form');
      }
      for(const field of draft.fields){
        const el=form&&[...form.querySelectorAll('input,textarea,select')].find(e=>field.id?e.id===field.id:e.name===field.name);
        if(!el)continue;
        const missingOption=el.tagName==='SELECT'&&field.value&&![...el.options].some(o=>o.value===field.value);
        if(!missing&&!field.dirty&&!missingOption)continue;
        if(missingOption){const option=document.createElement('option');option.value=field.value;option.textContent=(field.label||field.value)+'（元の選択）';el.append(option);}
        el.value=field.value;if(field.type==='checkbox'||field.type==='radio')el.checked=field.checked;
        for(let node=el.parentElement;node;node=node.parentElement)if(node.tagName==='DETAILS')node.open=true;
      }
    }
  }
  async function resumeTabEditing(){

    tabGuardError='';

      if(!await tabGuard.request())return;
      // Capture after waiting, so typing during a pending handover is retained.
      const drafts=tabDrafts(),raw=localStorage.getItem(KEY),remote=raw?normalize(JSON.parse(raw)):initial();
      if(raw&&!backupPreservesSource(JSON.parse(raw),remote))throw Error('最新記録を全件保持して読み込めないため切替を停止しました。JSONで退避してください。');
      const prepared=tabGuard.prepare(data,remote,raw,drafts,archiveDraft);
      if(!backupPreservesSource(prepared.merged,normalize(prepared.merged)))throw Error('保存件数・文字数の上限を超えるため切替を停止しました。JSONで退避してください。');
      tabGuard.commit(prepared);data=prepared.merged;storageError=false;localSaveEvidence='saved';

      const latestWorker=validCloudWorkerUrl(localStorage.getItem(CLOUD_WORKER_KEY)),latestSession=localStorage.getItem(CLOUD_SESSION_KEY)||'';

      syncConfig=latestConfig;writeBaseline=loadWriteBaseline();goalSyncBaseline=loadGoalSyncBaseline();safeSyncApproved=loadSafeSyncApproval();
      backupRestoreSyncGuard=localStorage.getItem(BACKUP_RESTORE_SYNC_GUARD_KEY)==='1';

      clearManualSyncReview();

    }catch(error){tabGuardError=error.name==='AbortError'?'別のタブで処理中です。処理が終わってからもう一度お試しください。':error.message;showToast(tabGuardError);}
    updateAutoSyncNotice();
