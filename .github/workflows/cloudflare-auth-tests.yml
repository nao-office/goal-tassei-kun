name: Cloudflare auth tests
on:
  pull_request:
    paths:
      - 'worker/**'
      - 'index.html'
      - 'cloud-auth.js'
      - 'cloud-auth.test.js'
      - 'sheets-writeback.js'
      - 'sheets-writeback.test.js'
      - 'goal-progress.js'
      - 'goal-progress.test.js'
      - 'README.md'
      - '.github/workflows/cloudflare-auth-tests.yml'
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'index.html'
      - 'cloud-auth.js'
      - 'cloud-auth.test.js'
      - 'README.md'
      - '.github/workflows/cloudflare-auth-tests.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test OAuth and synchronization safety
        run: node --test worker/auth.test.js sheets-writeback.test.js goal-progress.test.js cloud-auth.test.js
      - name: Parse browser inline script
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const html=fs.readFileSync('index.html','utf8');
          const inline=html.match(/<script>([\s\S]*?)<\/script>/);
          if(!inline)throw Error('Inline script not found');
          new Function(inline[1]);
          new Function(fs.readFileSync('sheets-writeback.js','utf8'));
          new Function(fs.readFileSync('goal-progress.js','utf8'));
          new Function(fs.readFileSync('cloud-auth.js','utf8'));
          console.log('index.html JavaScript syntax OK');
          NODE
