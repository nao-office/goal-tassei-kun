name: Cloudflare auth tests
on:
  pull_request:
    paths:
      - 'worker/**'
      - 'index.html'
      - 'cloud-auth.js'
      - 'cloud-auth.test.js'
      - 'daily-flow.test.js'
      - 'morning-flow.test.js'
      - 'sync-status.test.js'
      - 'save-failure.test.js'
      - 'backup-safety.test.js'
      - 'browser-device-sync.test.cjs'
      - 'keep-both-sync.js'
      - 'keep-both-sync.test.js'
      - 'automatic-app.test.js'
      - 'browser-keep-both.test.cjs'
      - 'browser-flow.test.cjs'
      - 'sheets-writeback.js'
      - 'sheets-writeback.test.js'
      - 'goal-management-sync.js'
      - 'goal-management-sync.test.js'
      - 'goal-progress.js'
      - 'goal-progress.test.js'
      - 'README.md'
      - '.github/workflows/cloudflare-auth-tests.yml'
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'index.html'
      - 'cloud-auth.js'
      - 'cloud-auth.test.js'
      - 'daily-flow.test.js'
      - 'morning-flow.test.js'
      - 'sync-status.test.js'
      - 'save-failure.test.js'
      - 'backup-safety.test.js'
      - 'browser-device-sync.test.cjs'
      - 'keep-both-sync.js'
      - 'keep-both-sync.test.js'
      - 'automatic-app.test.js'
      - 'browser-keep-both.test.cjs'
      - 'browser-flow.test.cjs'
      - 'sheets-writeback.js'
      - 'sheets-writeback.test.js'
      - 'goal-management-sync.js'
      - 'goal-management-sync.test.js'
      - 'goal-progress.js'
      - 'goal-progress.test.js'
      - 'README.md'
      - '.github/workflows/cloudflare-auth-tests.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test OAuth and synchronization safety
        run: node --test worker/auth.test.js sheets-writeback.test.js goal-management-sync.test.js goal-progress.test.js cloud-auth.test.js daily-flow.test.js morning-flow.test.js sync-status.test.js save-failure.test.js backup-safety.test.js keep-both-sync.test.js automatic-app.test.js
      - name: Parse browser inline script
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const html=fs.readFileSync('index.html','utf8');
          const inline=html.match(/<script>([\s\S]*?)<\/script>/);
          if(!inline)throw Error('Inline script not found');
          new Function(inline[1]);
          new Function(fs.readFileSync('sheets-writeback.js','utf8'));
          new Function(fs.readFileSync('goal-management-sync.js','utf8'));
          new Function(fs.readFileSync('goal-progress.js','utf8'));
          new Function(fs.readFileSync('cloud-auth.js','utf8'));
          new Function(fs.readFileSync('keep-both-sync.js','utf8'));
          console.log('index.html JavaScript syntax OK');
          NODE


  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser test tools
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Test morning flow and status with mocked Google only
        run: node browser-flow.test.cjs
      - name: Test two isolated device stores with mocked Sheets only
        run: node browser-device-sync.test.cjs
      - name: Test automatic keep-both sync with mocked Sheets only
        run: node browser-keep-both.test.cjs
      - name: Save browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-flow-screenshots
          path: test-results/
          if-no-files-found: ignore
